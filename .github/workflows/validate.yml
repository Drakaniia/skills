name: Validate Skills

on:
  pull_request:
    paths:
      - "skills/**"
      - "_shared/**"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "_shared/**"
  workflow_dispatch:

jobs:
  validate-frontmatter:
    name: Validate SKILL.md Frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install validation tool
        run: npm install -g skills-ref

      - name: Validate all skills
        run: |
          for skill in skills/*/; do
            echo "Validating $skill..."
            npx skills-ref validate "$skill" || exit 1
          done

  check-structure:
    name: Check Skill Directory Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required directories exist
        run: |
          for skill in audit-codebase folder-architecture code-design implement-folder-architecture; do
            dir="skills/$skill"
            if [ ! -f "$dir/SKILL.md" ]; then
              echo "❌ $dir/SKILL.md is missing"
              exit 1
            fi
            echo "✅ $dir has SKILL.md"
          done

      - name: Verify scripts are executable
        run: |
          for script in $(find skills/*/scripts -name '*.sh' 2>/dev/null); do
            if [ ! -x "$script" ]; then
              echo "⚠️  $script is not executable — consider chmod +x"
            else
              echo "✅ $script is executable"
            fi
          done

  check-cross-references:
    name: Check Shared Reference Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare shared references with skill copies
        run: |
          errors=0
          for ref in ORGANIZATION-PATTERNS.md SPLITTING-GUIDE.md; do
            canonical="_shared/references/$ref"
            if [ ! -f "$canonical" ]; then
              echo "⚠️  Canonical $canonical not found, skipping sync check"
              continue
            fi
            for skill in audit-codebase folder-architecture implement-folder-architecture; do
              skill_copy="skills/$skill/references/$ref"
              if [ -f "$skill_copy" ]; then
                # Compare from the first "## Universal Principles" heading onwards.
                # This avoids brittle line offsets since different skills have
                # different header lengths for their skill-specific intros.
                if ! diff <(sed -n '/^## Universal Principles/,$p' "$canonical") <(sed -n '/^## Universal Principles/,$p' "$skill_copy") > /dev/null 2>&1; then
                  echo "❌ $skill_copy differs from canonical $canonical"
                  errors=$((errors + 1))
                else
                  echo "✅ $skill_copy matches canonical"
                fi
              fi
            done
          done
          exit $errors
