name: Validate Skills

on:
  pull_request:
    paths:
      - "skills/**"
      - "_shared/**"
      - "hooks/**"
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - ".agents/**"
      - "assets/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "_shared/**"
      - "hooks/**"
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - ".agents/**"
      - "assets/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  validate-frontmatter:
    name: Validate SKILL.md Frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install validation tool
        run: npm install -g skills-ref

      - name: Validate all skills
        run: |
          for skill in skills/*/; do
            echo "Validating $skill..."
            npx skills-ref validate "$skill" || exit 1
          done

  check-structure:
    name: Check Skill Directory Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required directories exist
        run: |
          for skill in audit-codebase codebase-health code-design folder-architecture implement-folder-architecture; do
            dir="skills/$skill"
            if [ ! -f "$dir/SKILL.md" ]; then
              echo "❌ $dir/SKILL.md is missing"
              exit 1
            fi
            echo "✅ $dir has SKILL.md"
          done

      - name: Verify scripts are executable
        run: |
          for script in $(find skills/*/scripts -name '*.sh' 2>/dev/null); do
            if [ ! -x "$script" ]; then
              echo "⚠️  $script is not executable — consider chmod +x"
            else
              echo "✅ $script is executable"
            fi
          done

  # Replaces the old check-cross-references job. The per-skill reference copies
  # are generated artifacts (gitignored, see spec 5.11), so they no longer exist
  # in a fresh checkout and diffing them against the canonical files is a
  # guaranteed false failure. sync-references.sh --check now owns that concern.
  check-generated-clean:
    name: Check Generated References Are In Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild generated references and fail on drift
        run: bash _shared/scripts/sync-references.sh --check

      - name: Verify working tree is unchanged
        run: git diff --exit-code

  check-versions:
    name: Check Version Consistency Across Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check manifests against package.json version
        run: npm run check-versions

  test-hooks:
    name: Test Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24, not 20: npm@latest requires ^22.22.2 || ^24.15.0 || >=26, so
      # the upgrade below EBADENGINEs on 20. release.yml already runs 24 for
      # the same reason.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # release.yml installs npm@latest before testing, and npm changes its
      # output shapes between majors. Testing the runner's bundled npm instead
      # let the tarball test pass here and fail in the release run. Keep the two
      # on the same npm or this job stops being a gate on the release path.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Run test suite
        run: npm test

      - name: Check the OpenCode adapter is reachable
        run: npm run check-opencode

  validate-plugin:
    name: Validate Plugin Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: |
          if npm install -g @anthropic-ai/claude-code; then
            echo "Claude Code CLI installed"
          else
            echo "warning: could not install @anthropic-ai/claude-code" >&2
          fi

      - name: Validate plugin
        run: |
          if ! command -v claude > /dev/null 2>&1; then
            echo "::warning::Claude Code CLI unavailable on this runner — skipping 'claude plugin validate .'"
            exit 0
          fi
          claude plugin validate .
